name: Bug report
description: Report a reproducible Jiaojie defect using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private conversations, personal data, and proprietary material.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
  - type: input
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Include the exact command and a small synthetic input.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and limitations
    validations:
      required: true
